# Controller: run on the machine with the Plex container.
#   docker compose -f docker/compose.controller.yml run --rm controller            # TUI
#   docker compose -f docker/compose.controller.yml run --rm controller plex-loudness status
#
# Set in .env next to this file (or export): WORK_DIR, CONFIG, TZ
name: plex-loudness
services:
  controller:
    build: ..
    image: plex-loudness:latest
    command: ["plex-loudness", "tui"]
    stdin_open: true
    tty: true
    network_mode: none        # it only talks to the Plex container through the docker socket
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # docker backend: `docker exec` into the Plex container
      - ${CONFIG:-./config.toml}:/config/config.toml:ro
      - ${WORK_DIR:?set WORK_DIR to the shared folder}:/work
