# Worker: run on any machine that can read the media and the shared folder.
#   docker compose -f docker/compose.worker.yml up -d
#   docker compose -f docker/compose.worker.yml logs -f
#
# Set in .env next to this file (or export): MEDIA_DIR, WORK_DIR, CONFIG, PUID, PGID, WORKER_CPUS, TZ
name: plex-loudness
services:
  worker:
    build: ..
    image: plex-loudness:latest
    command: ["plex-loudness-worker"]
    restart: unless-stopped
    network_mode: none        # it only reads files
    user: "${PUID:-1000}:${PGID:-1000}"   # a user that can read the media and write the shared folder
    stop_grace_period: 30s    # running tracks are released for another worker to pick up
    environment:
      - TZ=${TZ:-UTC}
    cpus: ${WORKER_CPUS:-8}
    mem_limit: 6g             # each ffmpeg uses about 150-400 MB
    volumes:
      - ${MEDIA_DIR:?set MEDIA_DIR to the media root}:/media:ro
      - ${WORK_DIR:?set WORK_DIR to the shared folder}:/work
      - ${CONFIG:-./config.toml}:/config/config.toml:ro
